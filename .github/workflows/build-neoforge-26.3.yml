name: Mermod NeoForge 26.3 build

on:
  workflow_dispatch:
  push:
    branches:
      - port/neoforge-26.3

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Check wrapper
        run: chmod +x ./gradlew
      - name: Build NeoForge module
        run: ./gradlew :neoforge:build --stacktrace
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: mermod-neoforge-26.3
          path: neoforge/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
