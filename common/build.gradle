architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    implementation "dev.architectury:architectury:$rootProject.architectury_api_version"
    compileOnly "org.figuramc:figura-common-intermediary:$rootProject.figura_version"
    compileOnly "com.github.FiguraMC.luaj:luaj-core:$rootProject.luaj_version-figura"
    compileOnly "com.github.FiguraMC.luaj:luaj-jse:$rootProject.luaj_version-figura"
    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-common-neoforgeapi:$rootProject.fcap_version"
    compileOnly "me.shedaniel.cloth:cloth-config:$rootProject.cloth_config_version"
}