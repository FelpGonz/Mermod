plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    compileOnly "io.github.llamalad7:mixinextras-fabric:0.5.5"
    implementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"
    implementation "com.neovisionaries:nv-websocket-client:$rootProject.nv_websocket_version"
    implementation(include("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:$rootProject.fcap_version"))
    implementation("me.shedaniel.cloth:cloth-config-fabric:$rootProject.cloth_config_version") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    implementation "com.terraformersmc:modmenu:$rootProject.modmenu_version"
    implementation "eu.pb4.fork:trinkets:$rootProject.trinkets_version"
    implementation "org.ladysnake.cardinal-components-api:cardinal-components-base:$rootProject.cca_version"
    implementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:$rootProject.cca_version"
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    var replaceProperties = [
            mod_id: mod_id,
            mod_version: mod_version,
            mod_name: mod_name,
            mod_description: mod_description,
            mod_license: mod_license,
            fabric_loader_version: fabric_loader_version,
            minecraft_version: minecraft_version,
            architectury_api_version: architectury_api_version
    ]
    inputs.properties replaceProperties
    filesMatching("fabric.mod.json") {
        expand replaceProperties + [project: project]
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}
