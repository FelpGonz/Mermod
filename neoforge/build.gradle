plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url "https://maven.neoforged.net/releases" }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
    implementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"
    implementation "me.shedaniel.cloth:cloth-config-neoforge:$rootProject.cloth_config_version"
    implementation "org.anarres:jcpp:1.4.14"
    implementation "io.github.douira:glsl-transformer:3.0.0-pre3"
    implementation "org.antlr:antlr4-runtime:4.13.1"
    implementation project(':common')
}

// The common module contains Mermod's actual item, recipe, rendering,
// configuration and mixin classes. Gradle's project dependency makes those
// available at compile/runtime but does not put them inside the distributable
// mod JAR, so include the common output in the final NeoForge JAR.
tasks.named('jar', Jar).configure {
    from project(':common').sourceSets.main.output
}

processResources {
    var replaceProperties = [
            mod_id: mod_id,
            mod_version: mod_version,
            mod_name: mod_name,
            mod_description: mod_description,
            mod_license: mod_license,
            neoforge_version_range: neoforge_version_range,
            neoforge_loader_version_range: neoforge_loader_version_range,
            minecraft_version_range: minecraft_version_range,
            architectury_api_version: architectury_api_version
    ]
    inputs.properties replaceProperties
    filesMatching("META-INF/neoforge.mods.toml") {
        expand replaceProperties + [project: project]
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}
